@defer (when helpVisible()) {
  <div class="cfp-hotkeys-container fade" [class.in]="helpVisible()" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
    <div class="cfp-hotkeys">
      <h4 class="cfp-hotkeys-title">{{ title() }}</h4>
      <table>
        <tbody>
        @for (hotkey of hotkeys(); track $index) {
          <tr>
            <td class="cfp-hotkeys-keys">
              @for (key of hotkey.formatted; track key) {
                <span class="cfp-hotkeys-key">{{ key }}</span>
              }
            </td>
            <td class="cfp-hotkeys-text">{{ hotkey.description }}</td>
          </tr>
        }
        </tbody>
      </table>
      <div class="cfp-hotkeys-close" (click)="toggleCheatSheet()" role="button" tabindex="0"
           (keydown.enter)="toggleCheatSheet()" (keydown.space)="toggleCheatSheet()">&#215;</div>
    </div>
  </div>
} @placeholder {
  <div class="cfp-hotkeys-container fade" aria-hidden="true"></div>
}
